<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration form</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!--Hide internalization-->
    <style>
        iframe.skiptranslate {
            display: none; !important;
        }
        body {
            top: 0 !important;
        }
        footer {
            background-color: lightgray;
            height: 100px;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-left: 1%;
        }
    </style>
    <!--Hide internalization-->
    <script>
        function showPass() {
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" translate="no">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
            </ul>
            <nav class="navbar navbar-light bg-light">
                <form class="container-fluid justify-content-start" method="post" th:action="@{/auth/logout}">
                    <a th:href="@{/auth/sign-in}" sec:authorize="isAnonymous()" class="btn btn-outline-success me-2">Sign in</a>
                    <a th:href="@{/auth/sign-up}" sec:authorize="isAnonymous()" class="btn btn-sm btn-outline-secondary">Sign up</a>
                    <a th:href="@{/users/account}" sec:authorize="isAuthenticated()" class="btn btn-outline-success me-2">Account</a>
                    <button th:href="@{/auth/logout}" sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-secondary">
                        Hi,<div sec:authentication="name" translate="no">.</div>
                        <p>Logout?</p>
                    </button>
                </form>
            </nav>
        </div>
    </div>
</nav>
<div class="container">
    <h2>Registration</h2>
    <!-- Update the form to include th:action, th:object, and method attributes -->
    <!--/*@thymesVar id="user" type="com.epam.finaltask.dto.UserDTO"*/-->
    <form th:action="@{/auth/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <!-- Update input to use th:field for binding -->
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <!-- Update input to use th:field for binding -->
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Password" required>
            <input type="checkbox" onclick="showPass()"> Show Password
        </div>
        <div class="form-group">
            <label for="role">Choose your role:</label>
            <select class="form-control" id="role" th:field="*{role}">
                <option th:each="p : ${roles}" th:value="${p}" th:text="${p}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="phone">Your phone number:</label>
            <input type="text" class="form-control" id="phone" th:field="*{phoneNumber}" placeholder="0990003535" required>
        </div>
        <div class="form-group">
            <label for="balance">Insert your balance:</label>
            <input type="number" step="0.01" min="0" class="form-control" id="balance" th:field="*{balance}" placeholder="35.35" required>
        </div>
        <!-- Change the link to a submit button -->
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
<footer>
    <p>Select language for the localization:</p>
    <!--Internalization-->
    <div id="google_translate_element">
        <script type="text/javascript">
            function googleTranslateElementInit() {
                let language = navigator.language.substring(0, 2)
                language = language === "ru" ? "uk" : language
                new google.translate.TranslateElement({
                    pageLanguage: 'auto',
                    includedLanguages : 'en,' + language,
                }, 'google_translate_element');


                setTimeout(() => {
                    if (language !== "en") {
                        const select = document.querySelector('.goog-te-combo');
                        if (select) {
                            select.value = language;
                            select.dispatchEvent(new Event('change'));
                        }
                    }
                }, 1000);
            }
        </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <!--Internalization-->
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
