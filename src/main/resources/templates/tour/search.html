<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search tour by</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!--Hide internalization-->
    <style>
        iframe.skiptranslate {
            display: none; !important;
        }
        body {
            top: 0 !important;
        }
        footer {
            background-color: lightgray;
            height: 100px;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-left: 1%;
        }
    </style>
    <!--Hide internalization-->
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" translate="no">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
            </ul>
            <nav class="navbar navbar-light bg-light">
                <form class="container-fluid justify-content-start" method="post" th:action="@{/auth/logout}">
                    <a th:href="@{/auth/sign-in}" sec:authorize="isAnonymous()" class="btn btn-outline-success me-2">Sign in</a>
                    <a th:href="@{/auth/sign-up}" sec:authorize="isAnonymous()" class="btn btn-sm btn-outline-secondary">Sign up</a>
                    <a th:href="@{/users/account}" sec:authorize="isAuthenticated()" class="btn btn-outline-success me-2">Account</a>
                    <button th:href="@{/auth/logout}" sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-secondary">
                        Hi,<div sec:authentication="name" translate="no">.</div>
                        Logout?
                    </button>
                </form>
            </nav>
        </div>
    </div>
</nav>
<div class="container">
    <h2>Search tour by specific parameter</h2>
    <!-- Update the form to include th:action, th:object, and method attributes -->
    <div th:switch="${type}">
        <form method="get" class="form-group" th:case="user" th:action="@{/vouchers/user}">
            <label for="id">User's ID</label>
            <input type="text" class="form-control" id="id" name="id" th:value="${id}" placeholder="Enter user's ID" required>
            <button type="submit" class="btn btn-primary">Search for tours</button>
        </form>
        <form method="get" class="form-group" th:case="tourtype" th:action="@{/vouchers/tour}">
            <label for="tour">Tour type</label>
            <input type="text" class="form-control" id="tour" name="tour" th:value="*{tour}" placeholder="Enter tour type" required>
            <button type="submit" class="btn btn-primary">Search for tours</button>
        </form>
        <form method="get" class="form-group" th:case="transfertype" th:action="@{/vouchers/transfer}">
            <label for="transfer">Type of movement</label>
            <input type="text" class="form-control" id="transfer" name="transfer" th:value="*{transfer}" placeholder="Enter type of movement" required>
            <button type="submit" class="btn btn-primary">Search for tours</button>
        </form>
        <form method="get" class="form-group" th:case="price" th:action="@{/vouchers/price}">
            <label for="price">Price</label>
            <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" th:value="*{price}" placeholder="Enter price" required>
            <button type="submit" class="btn btn-primary">Search for tours</button>
        </form>
        <form method="get" class="form-group" th:case="hoteltype" th:action="@{/vouchers/hotel}">
            <label for="hotel">Hotel type</label>
            <input type="text" class="form-control" id="hotel" name="hotel" th:value="*{hotel}" placeholder="Enter hotel type" required>
            <button type="submit" class="btn btn-primary">Search for tours</button>
        </form>
        <form method="get" class="form-group" th:case="*" th:action="@{/vouchers/}">
            <p>Search by this type is not available. Try again.</p>
            <a class="nav-link active" aria-current="page">
                Dashboard
            </a>
        </form>
    </div>
</div>
<footer>
    <p>Select language for the localization:</p>
    <!--Internalization-->
    <div id="google_translate_element">
        <script type="text/javascript">
            function googleTranslateElementInit() {
                let language = navigator.language.substring(0, 2)
                language = language === "ru" ? "uk" : language
                new google.translate.TranslateElement({
                    pageLanguage: 'auto',
                    includedLanguages : 'en,' + language,
                }, 'google_translate_element');
            }
        </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <!--Internalization-->
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
