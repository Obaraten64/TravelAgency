<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:switch="${operation}">
    <meta charset="UTF-8">
    <title th:case="create">Form for voucher creation</title>
    <title th:case="update">Form for voucher update</title>
    <title th:case="*">Error</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!--Hide internalization-->
    <style>
        iframe.skiptranslate {
            display: none; !important;
        }
        body {
            top: 0 !important;
        }
        footer {
            background-color: lightgray;
            height: 100px;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-left: 1%;
        }
    </style>
    <!--Hide internalization-->
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" translate="no">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/vouchers/?pageSize=5&pageNumber=0}" sec:authorize="isAuthenticated()">
                        Dashboard
                    </a>
                </li>
            </ul>
            <nav class="navbar navbar-light bg-light">
                <form class="container-fluid justify-content-start" method="post" th:action="@{/auth/logout}">
                    <a th:href="@{/auth/sign-in}" sec:authorize="isAnonymous()" class="btn btn-outline-success me-2">Sign in</a>
                    <a th:href="@{/auth/sign-up}" sec:authorize="isAnonymous()" class="btn btn-sm btn-outline-secondary">Sign up</a>
                    <a th:href="@{/users/account}" sec:authorize="isAuthenticated()" class="btn btn-outline-success me-2">Account</a>
                    <button th:href="@{/auth/logout}" sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-secondary">
                        Hi,<div sec:authentication="name" translate="no">.</div>
                        <p>Logout?</p>
                    </button>
                </form>
            </nav>
        </div>
    </div>
</nav>
<div class="container">
    <!-- Update the form to include th:action, th:object, and method attributes -->
    <!--/*@thymesVar id="voucher" type="com.epam.finaltask.dto.VoucherDTO"*/-->
    <form th:object="${voucher}" method="post" th:switch="${operation}"
          th:if="${operation} == 'create' or ${operation} == 'update'">
        <h2 th:text="${operation.substring(0,1).toUpperCase() + operation.substring(1)} + ' tour'"></h2>
        <div class="form-group">
            <label for="title">Title</label>
            <!-- Update input to use th:field for binding -->
            <input type="text" class="form-control" id="title"
                   th:field="*{title}" placeholder="Enter title" th:required="${operation} == 'create' ? true : false">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <!-- Update input to use th:field for binding -->
            <input type="text" class="form-control" id="description" th:field="*{description}"
                   placeholder="Enter description" th:required="${operation} == 'create' ? true : false">
        </div>
        <div class="form-group">
            <label for="price">Insert price of the voucher:</label>
            <input type="number" step="0.01" min="0" class="form-control" id="price" th:field="*{price}"
                   placeholder="35.35" th:required="${operation} == 'create' ? true : false">
        </div>
        <div class="form-group">
            <label for="tour">Choose tour type:</label>
            <select class="form-control" id="tour" th:field="*{tourType}" th:required="${operation} == 'create' ? true : false">
                <option disabled selected value=""> -- Select a tour type -- </option>
                <option th:each="tour : ${tours}" th:value="${tour}" th:text="${tour}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="transfer">Choose a type of movement:</label>
            <select class="form-control" id="transfer" th:field="*{transferType}" th:required="${operation} == 'create' ? true : false">
                <option disabled selected value=""> -- Select a type of movement -- </option>
                <option th:each="transfer : ${transfers}" th:value="${transfer}" th:text="${transfer}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="hotel">Choose a hotel type:</label>
            <select class="form-control" id="hotel" th:field="*{hotelType}" th:required="${operation} == 'create' ? true : false">
                <option disabled selected value=""> -- Select a hotel type -- </option>
                <option th:each="hotel : ${hotels}" th:value="${hotel}" th:text="${hotel}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="status">Choose tour status:</label>
            <select class="form-control" id="status" th:field="*{status}" th:required="${operation} == 'create' ? true : false">
                <option disabled selected value=""> -- Select a tour status -- </option>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="arrivalDate">Arrival date</label>
            <input type="date" class="form-control" id="arrivalDate" th:field="*{arrivalDate}"
                   placeholder="Enter description" th:required="${operation} == 'create' ? true : false">
        </div>
        <div class="form-group">
            <label for="evictionDate">Eviction date</label>
            <input type="date" class="form-control" id="evictionDate" th:field="*{evictionDate}"
                   placeholder="Enter description" th:required="${operation} == 'create' ? true : false">
        </div>
        <div class="form-group">
            <input type="checkbox" id="hot" th:field="*{isHot}"/>
            <label for="hot">Hot status</label>
        </div>
        <!-- Change the link to a submit button -->
        <button type="submit" class="btn btn-primary" th:formaction="@{/vouchers/create}"
                th:case="create">Create tour</button>
        <button type="submit" class="btn btn-primary" th:formaction="@{/vouchers/{voucherId}/update(voucherId=${id})}"
                th:case="update">Update tour</button>
    </form>
    <div th:if="${operation} != 'create' and ${operation} != 'update'">
        <h1>Error</h1>
        <p>Invalid operation</p>
    </div>
</div>
<footer>
    <p>Select language for the localization:</p>
    <!--Internalization-->
    <div id="google_translate_element">
        <script type="text/javascript">
            function googleTranslateElementInit() {
                let language = navigator.language.substring(0, 2)
                language = language === "ru" ? "uk" : language
                new google.translate.TranslateElement({
                    pageLanguage: 'auto',
                    includedLanguages : 'en,' + language,
                }, 'google_translate_element');


                setTimeout(() => {
                    if (language !== "en") {
                        const select = document.querySelector('.goog-te-combo');
                        if (select) {
                            select.value = language;
                            select.dispatchEvent(new Event('change'));
                        }
                    }
                }, 1000);
            }
        </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <!--Internalization-->
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
