<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!--Hide internalization-->
    <style>
        iframe.skiptranslate {
            display: none; !important;
        }
        body {
            top: 0 !important;
        }
        footer {
            background-color: lightgray;
            height: 100px;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            padding-left: 1%;
        }
    </style>
    <!--Hide internalization-->
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" translate="no">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
            </ul>
            <nav class="navbar navbar-light bg-light">
                <form class="container-fluid justify-content-start" method="post" th:action="@{/auth/logout}">
                    <a th:href="@{/auth/sign-in}" sec:authorize="isAnonymous()" class="btn btn-outline-success me-2">Sign in</a>
                    <a th:href="@{/auth/sign-up}" sec:authorize="isAnonymous()" class="btn btn-sm btn-outline-secondary">Sign up</a>
                    <a th:href="@{/users/account}" sec:authorize="isAuthenticated()" class="btn btn-outline-success me-2">Account</a>
                    <button th:href="@{/auth/logout}" sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-secondary">
                        Hi,<div sec:authentication="name" translate="no">.</div>
                        <p>Logout?</p>
                    </button>
                </form>
            </nav>
        </div>
    </div>
</nav>
<div align="center">
    <h1>Error</h1>
    <p th:text="${exception}"></p>
</div>
<footer>
    <p>Select language for the localization:</p>
    <!--Internalization-->
    <div id="google_translate_element">
        <script type="text/javascript">
            function googleTranslateElementInit() {
                let language = navigator.language.substring(0, 2)
                language = language === "ru" ? "uk" : language
                new google.translate.TranslateElement({
                    pageLanguage: 'auto',
                    includedLanguages : 'en,' + language,
                }, 'google_translate_element');


                setTimeout(() => {
                    if (language !== "en") {
                        const select = document.querySelector('.goog-te-combo');
                        if (select) {
                            select.value = language;
                            select.dispatchEvent(new Event('change'));
                        }
                    }
                }, 1000);
            }
        </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </div>
    <!--Internalization-->
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
